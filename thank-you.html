<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ישראל מגזין | תודה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .thanks-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 4.5rem 5vw 5rem;
    text-align: center;
  }
  .thanks-check {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: #ECFDF5;
    border: 2px solid #B7F0D0;
    color: #16A34A;
    font-size: 2.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
  }
  .thanks-title {
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 900;
    letter-spacing: -1px;
    margin-bottom: 0.8rem;
  }
  .thanks-title span { color: var(--red); }
  .thanks-info {
    font-size: 1.05rem;
    color: var(--mid);
    line-height: 1.75;
    max-width: 440px;
    margin: 0 auto 2.2rem;
  }
  .thanks-wa {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    font-weight: 800;
    font-size: 1.05rem;
    padding: 16px 36px;
    border-radius: 40px;
    box-shadow: 0 10px 28px rgba(37,211,102,.3);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .thanks-wa:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(37,211,102,.38); }
  .thanks-back {
    display: block;
    margin-top: 2.2rem;
    font-size: 0.88rem;
    color: var(--mid);
    text-decoration: none;
  }
  .thanks-back:hover { color: var(--red); }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo-link"><span class="logo-il">ישראל</span><span class="logo-mag">מגזין</span></a>
  <ul class="nav-cats">
    <li><a href="category.html?cat=נדל״ן">נדל"ן</a></li>
    <li><a href="category.html?cat=קוסמטיקה">קוסמטיקה</a></li>
    <li><a href="category.html?cat=בריאות">בריאות</a></li>
    <li><a href="category.html?cat=לייף סטייל">לייף סטייל</a></li>
    <li><a href="category.html?cat=שיווק">שיווק</a></li>
  </ul>
  <button class="hamburger" id="hamburger" onclick="toggleDrawer()" aria-label="תפריט">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-title">קטגוריות</div>
  <a href="category.html?cat=נדל״ן"><span class="cat-dot" style="background:#2d6a9f"></span>נדל"ן</a>
  <a href="category.html?cat=קוסמטיקה"><span class="cat-dot" style="background:#9b4f72"></span>קוסמטיקה</a>
  <a href="category.html?cat=בריאות"><span class="cat-dot" style="background:#3a8c5c"></span>בריאות</a>
  <a href="category.html?cat=לייף סטייל"><span class="cat-dot" style="background:#c8702a"></span>לייף סטייל</a>
  <a href="category.html?cat=שיווק"><span class="cat-dot" style="background:#c8352a"></span>שיווק</a>
  <a href="index.html"><span class="cat-dot" style="background:#0f0f0f"></span>דף הבית</a>
  <div class="drawer-admin"><a href="admin/index.html">ניהול ✎</a></div>
</div>

<div class="thanks-wrap">
  <div class="thanks-check">✓</div>
  <h1 class="thanks-title" id="thanksTitle">תודה!</h1>
  <p class="thanks-info">
    קיבלנו את הפרטים שלך בהצלחה. אחת מהיועצות שלנו תחזור אליך בהקדם
    לתיאום <strong>פגישת ייעוץ חינמית</strong> בקליניקה שבחרת.
  </p>
  <a class="thanks-wa" id="thanksWaBtn" href="https://wa.me/972552235439" target="_blank" rel="noopener">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    המשך בוואטסאפ
  </a>
  <a href="index.html" class="thanks-back" id="thanksBackLink">← חזרה לעמוד הבית</a>
</div>

<script>
// מקבל ?name= ו-?wa= (הקישור המלא, כולל טקסט מוכן מראש) ו-?articleId=
// מהטופס ששלח לכאן
const params = new URLSearchParams(location.search);
const name = params.get('name');
const wa = params.get('wa');
const articleId = params.get('articleId');

if (name) {
  document.getElementById('thanksTitle').innerHTML = 'תודה, <span>' + name.replace(/</g,'&lt;') + '</span>!';
}
if (wa) {
  document.getElementById('thanksWaBtn').href = wa;
}
// חזרה לכתבה שממנה הגיע הטופס, לא לדף הבית — נופל חזרה לדף הבית רק אם
// הגיעו לכאן בלי articleId (למשל ביקור ישיר בעמוד)
if (articleId) {
  const backLink = document.getElementById('thanksBackLink');
  backLink.href = 'article.html?id=' + encodeURIComponent(articleId);
  backLink.textContent = '← חזרה לכתבה';
}
</script>

<script>
function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
  document.getElementById('hamburger').classList.toggle('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('hamburger').classList.remove('open');
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDrawer(); });
</script>

<!-- Firebase (needed to read /settings/codes for the thank-you-page pixel) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<!-- Code Injector — also fires the general site-wide codes (GTM/GA/etc)
     here like any real page view, plus the thank-you-only conversion
     pixel set in the admin panel -->
<script src="js/code-injector.js"></script>
</body>
</html>
