    font-family: 'Heebo', sans-serif;

    font-weight: 900;
    line-height: 1.3;

    margin-bottom: 1rem;

    color: var(--mid);

  .article-body {
    font-size: 1.25rem;

  /* רשת בטיחות: כל תמונה שהוכנסה לתוכן (כולל הדבקה ישירה שמדלגת על
     כפתור "תמונה" בעורך, שכן מוסיף style="max-width:100%" משלו) חייבת
     להיות מוגבלת לרוחב העמודה — אחרת תמונה ברזולוציה מלאה (כמו צילום
     מסך) גולשת מחוץ לעמוד ושוברת את הפריסה. */

  .related-section {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 5vw 4rem;
    border-top: 2px solid var(--ink);
    padding-top: 2rem;
  }
  .related-title {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }
  .related-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5rem;
  }
  .related-card {
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--line);
    padding: 1.2rem;
    display: block;
    transition: border-color 0.2s;
  }
  .related-card:hover { border-color: var(--red); }
  .related-card:hover .card-title { color: var(--red); }

  @media (max-width: 600px) {
    .related-grid { grid-template-columns: 1fr; }
  }
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<script>
// ── מצב תצוגה מקדימה חיה ──
// כשהעמוד נטען בתוך iframe מהעורך (?preview=1), הוא לא פונה ל-Firebase
// בכלל — הוא מציג בדיוק את הנתונים שמגיעים מהעורך דרך postMessage,
// באותו רכיב רינדור בדיוק שמשמש כתבה אמיתית (אותה חוויה, 100%).
const IS_PREVIEW = new URLSearchParams(window.location.search).get('preview') === '1';

// שומר את הערכים האחרונים שכן צוירו, כדי לעדכן רק את מה שבאמת השתנה —
// חשוב בעיקר בתצוגה מקדימה חיה, שקוראת לפונקציה הזו על כל הקלדה: בלי זה,
// כל עדכון (אפילו בשדה טקסט לא קשור) היה הורס ובונה מחדש את התמונה, וגורם
// לה "להבהב" כי הדפדפן מפענח מחדש base64 כבד בכל פעם.
let lastRenderedArticle = {};

function renderArticleContent(article) {
  document.title = `ישראל מגזין | ${article.title || ''}`;

  const isFirstRender = !document.getElementById('pv-cat');
  if (isFirstRender) {
    document.getElementById('article-output').innerHTML = `
      <div class="article-wrap">
        <div class="article-cat" id="pv-cat"></div>
        <h1 class="article-title" id="pv-title"></h1>
        <div class="article-meta">
          <span id="pv-date"></span>
          <span id="pv-readtime"></span>
        </div>
        <p class="article-excerpt" id="pv-excerpt" style="display:none"></p>
        <div id="pv-media"></div>
        <div class="article-body" id="article-body-content"></div>
      </div>
    `;
  }

  const catEl = document.getElementById('pv-cat');
  catEl.textContent = article.category || '';
  catEl.style.color = getCategoryColor(article.category);
  document.getElementById('pv-title').textContent = article.title || '(ללא כותרת)';
  document.getElementById('pv-date').textContent = `📅 ${formatDate(article.date)}`;
  document.getElementById('pv-readtime').textContent = `⏱ ${article.readTime || 5} דקות קריאה`;

  const excerptEl = document.getElementById('pv-excerpt');
  if (article.excerpt) { excerptEl.textContent = article.excerpt; excerptEl.style.display = ''; }
  else { excerptEl.style.display = 'none'; }

  // בלוק המדיה (תמונה/אמוג'י) נבנה מחדש רק כשהוא באמת משתנה
  if (article.image !== lastRenderedArticle.image || article.emoji !== lastRenderedArticle.emoji) {
    document.getElementById('pv-media').innerHTML = article.image
      ? `<img src="${article.image}" style="width:100%;max-height:420px;object-fit:cover;display:block;margin-bottom:2rem">`
      : `<div class="article-emoji-banner">${article.emoji || '📝'}</div>`;
  }

  // גוף הכתבה נבנה מחדש (וה-scripts שבתוכו מורצים) רק כשהתוכן באמת משתנה —
  // מונע גם הרצה כפולה של טריגרים/פופאפים מוטמעים על כל הקלדה
  if (article.content !== lastRenderedArticle.content) {
    const body = document.getElementById('article-body-content');
    body.innerHTML = article.content || '';
    body.querySelectorAll('script').forEach(oldScript => {
      const newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(a => newScript.setAttribute(a.name, a.value));
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }

  lastRenderedArticle = article;
}

async function init() {
  if (IS_PREVIEW) {
    document.getElementById('article-output').innerHTML = `
      <div class="article-wrap">
        <p style="color:var(--mid);text-align:center;padding:4rem 0">ממתין לנתונים מהעורך…</p>
      </div>`;
    let lastPreviewArticle = {};
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'pulsar-preview-data' && e.data.article) {
        const incoming = e.data.article;
        // אם לא נשלחה תמונה בהודעה הזו, שמרים על האחרונה שכן נשלחה —
        // כך לא צריך לשלוח שוב base64 כבד על כל שינוי טקסט קטן
        if (!('image' in incoming)) incoming.image = lastPreviewArticle.image || '';
        lastPreviewArticle = incoming;
        renderArticleContent(incoming);
      }
    });
    // הודע להורה שאנחנו מוכנים לקבל נתונים (מטפל במקרה שההודעה
    // הראשונה מהעורך נשלחה לפני שה-iframe סיים להיטען)
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'pulsar-preview-ready' }, '*');
    }
    return; // לא פונים ל-Firebase במצב תצוגה מקדימה בכלל
  }

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const article = id ? await getArticleById(id) : null;

  if (!article) {
    document.getElementById('article-output').innerHTML = `
      <div class="article-wrap">
        <p style="color:var(--mid);text-align:center;padding:4rem 0">הכתבה לא נמצאה. <a href="index.html" style="color:var(--red)">חזרה לבית ←</a></p>
      </div>`;
    return;
  }

  renderArticleContent(article);

  // Related articles
  const all = await getArticles();
  const related = all.filter(a => a.id !== article.id && a.category === article.category).slice(0, 4);
  if (related.length > 0) {
    document.getElementById('related-output').innerHTML = `
      <div class="related-section">
        <div class="related-title">כתבות נוספות בקטגוריה</div>
        <div class="related-grid">
          ${related.map(a => `
            <a href="article.html?id=${a.id}" class="related-card">
              <div style="font-size:2rem;margin-bottom:0.5rem">${a.emoji}</div>
              <div class="card-cat" style="color:${getCategoryColor(a.category)};font-size:0.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:0.3rem">${a.category}</div>
              <div class="card-title">${a.title}</div>
              <div class="card-meta" style="margin-top:0.5rem"><span>${formatDate(a.date)}</span></div>
            </a>
          `).join('')}
        </div>
      </div>`;
  }
}

function handleSubscribe() {
  const email = document.getElementById('email-input').value.trim();
  if (!email || !email.includes('@')) { alert('נא להזין כתובת אימייל תקינה'); return; }
  if (typeof database !== 'undefined') {
    database.ref('newsletter').push({ email, timestamp: new Date().toISOString(), source: 'article' })
      .catch(err => console.error('❌ Newsletter save failed:', err));
  }
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
  document.getElementById('email-input').value = '';
}

// ── WIDGET AUTO-HEIGHT ──
// ווידג'טים מוטמעים (קופות/מוריה) מודדים כמה גובה הם באמת צריכים ומדווחים
// עם postMessage — כדי שהקופסה תמיד תתאים בדיוק לתוכן, בלי גלילה פנימית
// מיותרת ובלי לחתוך תוכן.
// הטמעה בכתבה: אין תקרה — הכתבה עצמה יכולה פשוט להיות גבוהה יותר, אז
// האייפריים גדל בדיוק לגובה שדווח.
// פופאפ: זה מודאל שחייב להישאר בתוך המסך הנראה, אז הקופסה גדלה עד לתוכן
// אך אף פעם לא מעבר ל-92vh — אם תוכן ספציפי גבוה מהמסך, גלילה פנימית שם
// היא ברירת מחדל נכונה (התנהגות רגילה למודאל), לא באג.
window.addEventListener('message', function (e) {
  const heightMsgTypes = ['kupot-widget-height', 'moria-widget-height', 'manhattan-widget-height'];
  if (!e.data || !heightMsgTypes.includes(e.data.type)) return;
  const h = Math.max(300, Math.min(Math.round(e.data.height), 1600));
  const iframes = document.querySelectorAll('.embedded-form-block iframe, .embedded-popup-block iframe');
  for (const f of iframes) {
    if (f.contentWindow !== e.source) continue;
    const popupBox = f.closest('.embedded-popup-block') ? f.parentElement : null;
    if (popupBox) {
      popupBox.style.height = 'min(' + h + 'px, 92vh)';
    } else {
      f.style.transition = 'height .25s ease'; // הגובה משתנה בכל מעבר שלב — בלי זה זה קופץ בפתאומיות
      f.style.height = h + 'px';
      f.style.minHeight = h + 'px';
    }
    break;
  }
});

init();
</script>

<script>
function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
  document.getElementById('hamburger').classList.toggle('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('hamburger').classList.remove('open');
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDrawer(); });
</script>
