<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>בדיקת התאמה</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;height:100%}
body{font-family:Arial,"Heebo",sans-serif;color:#111;min-height:100vh;display:flex;align-items:center;justify-content:center}
.widget{width:100%;max-width:320px;margin:0 auto;padding:0 6px}
.stage{height:378px;position:relative;overflow:hidden}
.step{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:translateX(-18px);transition:.28s ease}
.step.active{opacity:1;visibility:visible;transform:translateX(0)}
.title{width:98%;text-align:center;margin:2px auto 22px;font-size:23px;font-weight:900;line-height:1.32;padding:0 4px 18px;position:relative}
.title:before,.title:after{content:"";position:absolute;left:50%;height:0;border-top:5px solid #72f06b;border-radius:50%;transform-origin:left center;opacity:.95}
.title:before{bottom:6px;width:60%;transform:translateX(-50%) rotate(-1deg) scaleX(0);animation:signatureOne 2.4s ease-in-out infinite}
.title:after{bottom:0;width:52%;border-top-width:3px;transform:translateX(-46%) rotate(-1deg) scaleX(0);animation:signatureTwo 2.4s .28s ease-in-out infinite}
@keyframes signatureOne{0%,12%{transform:translateX(-50%) rotate(-1deg) scaleX(0);opacity:.2}48%,82%{transform:translateX(-50%) rotate(-1deg) scaleX(1);opacity:1}100%{transform:translateX(-50%) rotate(-1deg) scaleX(1);opacity:.55}}
@keyframes signatureTwo{0%,18%{transform:translateX(-46%) rotate(-1deg) scaleX(0);opacity:.15}52%,82%{transform:translateX(-46%) rotate(-1deg) scaleX(1);opacity:.9}100%{transform:translateX(-46%) rotate(-1deg) scaleX(1);opacity:.45}}

.underline{display:none}
.underline:after{content:"";position:absolute;top:0;right:-34px;width:34px;height:100%;background:rgba(255,255,255,.8);filter:blur(2px);animation:lineMove 1.7s ease-in-out infinite}
@keyframes lineMove{0%{right:-34px}50%,100%{right:112px}}

.logo-list{display:flex;flex-direction:column;gap:7px;align-items:center;width:100%}
.kupa{display:block;width:min(69vw,232px);padding:0;border:0;background:transparent;border-radius:999px;overflow:hidden;cursor:pointer;animation:pulse 1.7s ease-in-out infinite}
.kupa:nth-child(2){animation-delay:.18s}.kupa:nth-child(3){animation-delay:.36s}.kupa:nth-child(4){animation-delay:.54s}
.kupa img{display:block;width:100%;height:auto}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.question{width:100%;text-align:center;margin:16px 0 14px;font-size:21px;font-weight:900;line-height:1.25}
.hello{width:100%;text-align:center;margin:10px 0 2px;font-size:18px;font-weight:800;color:#6d28d9}
.field{width:min(82vw,276px);margin:0 auto 10px}
input{width:100%;height:50px;border:1px solid #ddd;border-radius:14px;padding:0 14px;font-size:16px;text-align:right;outline:none;background:#fff}
input:focus{border-color:#9b7ef0;box-shadow:0 0 0 4px rgba(155,126,240,.15)}
.field-error{display:none;color:#d33;font-size:13px;margin-top:6px;text-align:center}
.field-error.show{display:block}
input.invalid{border-color:#d33}
.options{display:flex;flex-direction:column;gap:8px;width:min(82vw,276px)}
.option{height:44px;border:1px solid #e4e4e7;border-radius:14px;background:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.option:active{transform:scale(.98)}
.actions{width:min(82vw,276px);display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;padding-bottom:0}
.next,.submit,.back{height:48px;border:0;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer}
.next,.submit{width:150px;flex:0 0 150px;background:linear-gradient(90deg,#24d85d,#10b94a);color:#fff;box-shadow:0 8px 18px rgba(16,185,74,.28)}
.back{width:72px;background:#f4f4f5;color:#52525b}

.selected-logo{width:210px;min-height:58px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;overflow:visible;border-radius:999px;padding:0;box-shadow:none;background:transparent}
.selected-logo img{display:block;width:100%;height:auto;max-width:none;max-height:none;object-fit:contain;border-radius:999px;box-shadow:0 7px 17px rgba(0,0,0,.13)}

.step[data-step="1"]{justify-content:center;padding:0}
.step[data-step="1"] .question{margin:2px 0 14px}
.step[data-step="1"] .actions{margin-top:10px}

.step[data-step="2"],.step[data-step="3"],.step[data-step="4"],.step[data-step="5"]{justify-content:center;padding:0}
.age-options .option{direction:ltr;unicode-bidi:isolate}
.success{justify-content:center;text-align:center}
.check{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:#ecfdf5;color:#059669;font-size:40px;font-weight:900;margin-bottom:14px}
.success h2{margin:0 0 8px;font-size:22px}
.success p{margin:0 0 18px;font-size:15px;color:#666}
.whatsapp{display:flex;align-items:center;justify-content:center;width:min(82vw,290px);height:50px;border-radius:14px;background:#25d366;color:#fff;text-decoration:none;font-size:15px;font-weight:900}
@media(max-width:380px){.widget{max-width:300px;padding:0 4px}.stage{height:372px}.title{font-size:21px;line-height:1.28;margin:2px auto 18px;padding-bottom:16px}.kupa{width:min(69vw,220px)}.logo-list{gap:6px}.question{font-size:20px;margin-top:12px}.selected-logo{width:198px;min-height:55px}}
</style>
</head>

const fundClasses={'לאומית':'fund-leumit','מאוחדת':'fund-meuhedet','מכבי':'fund-maccabi','כללית':'fund-clalit'};
function show(i){steps[current].classList.remove('active');current=i;steps[current].classList.add('active')}
document.querySelectorAll('.kupa').forEach(b=>b.onclick=()=>{lead.fund=b.dataset.fund;selectedFundLogo.src=b.querySelector('img').src;selectedFundLogo.alt=lead.fund;selectedFundLogo.parentElement.className='selected-logo';show(1)});
document.querySelector('[data-step="1"] .next').onclick=()=>{const v=firstName.value.trim();if(!v){firstName.focus();firstName.classList.add('invalid');firstNameError.classList.add('show');return}firstName.classList.remove('invalid');firstNameError.classList.remove('show');lead.firstName=v;lead.name=v;helloName.textContent='היי '+v;show(2)};
firstName.addEventListener('input',()=>{firstName.classList.remove('invalid');firstNameError.classList.remove('show')});
document.querySelectorAll('.options').forEach(g=>g.querySelectorAll('.option').forEach(b=>b.onclick=()=>{lead[g.dataset.name]=b.dataset.value;show(current+1)}));
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>show(Math.max(0,current-1)));
document.querySelector('.submit').onclick=()=>{
  const p=phone.value.trim();
  const d=p.replace(/[^\d]/g,''); // ספרות בלבד — מתעלם מ-+ / רווחים / מקפים
  // מקומי: 0+קידומת+7 ספרות (קווי) או 05+ספרה+7 ספרות (נייד) | בינלאומי: 972 במקום ה-0 המוביל
  const validLocal=/^0[23489]\d{7}$/.test(d)||/^05\d{8}$/.test(d);
  const validIntl=/^972[23489]\d{7}$/.test(d)||/^9725\d{8}$/.test(d);
  if(!validLocal&&!validIntl){phone.focus();phone.classList.add('invalid');phoneError.classList.add('show');return}
  phone.classList.remove('invalid');phoneError.classList.remove('show');
  lead.phone=p;

  const whatsappMessage=[
    'הגעתי מהכתבה מגזין ישראלי',
    'אשמח לייעוץ חינם',
    '',
    'שם: '+lead.name,
    'קופת חולים: '+lead.fund,
    'רוצה להסיר: '+lead.treatment,
    'קבוצת גיל: '+lead.age,
    'קליניקה מועדפת: '+lead.clinic,
    'טלפון: '+lead.phone
  ].join('\n');

  document.getElementById('whatsappLink').href=
    'https://wa.me/972552235439?text='+encodeURIComponent(whatsappMessage);

  console.log('Lead',lead);
  saveLead(lead);
  show(6);
};
phone.addEventListener('input',()=>{phone.classList.remove('invalid');phoneError.classList.remove('show')});

// ── SAVE LEAD — Firebase (source of truth) + Google Sheets forward ──
// Fire-and-forget: never blocks the success screen / WhatsApp button above.
function saveLead(lead){
  const params=new URLSearchParams(location.search);
  const leadData={
    ...lead,
    timestamp:new Date().toLocaleString('he-IL'),
    articleId:params.get('articleId')||'',
    source:params.get('source')||'widget'
  };
  if(typeof database==='undefined'){console.error('❌ Firebase not loaded — lead not saved');return}
  database.ref('leads').push(leadData).catch(err=>console.error('❌ Firebase lead save failed:',err));
  database.ref('settings/sheetsWebhookUrl').once('value').then(snap=>{
    const url=snap.val();
    if(!url)return;
    return fetch(url,{method:'POST',mode:'no-cors',body:new URLSearchParams(leadData)});
  }).catch(err=>console.error('❌ Sheets forward failed:',err));
}
</script>

<script>
function sendWidgetHeight(){
  const h=document.documentElement.scrollHeight;
  if(window.parent!==window.parent.parent || window.parent!==window){
    window.parent.postMessage({type:'kupot-widget-height',height:h},'*');
  }
}
window.addEventListener('load',sendWidgetHeight);
window.addEventListener('resize',sendWidgetHeight);
setTimeout(sendWidgetHeight,250);
</script>
